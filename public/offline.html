<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Renovation Limassol</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      max-width: 480px;
      backdrop-filter: blur(12px);
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; animation: pulse 2s infinite; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; }
    p  { color: #9ca3af; line-height: 1.6; margin-bottom: 1.5rem; }
    a  {
      display: inline-block;
      background: #EA580C;
      color: white;
      font-weight: 600;
      padding: 0.75rem 2rem;
      border-radius: 0.875rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    a:hover { background: #c2410c; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Please check your network and try again.</p>
    <a href="/" onclick="location.reload(); return false;">Try Again</a>
  </div>
</body>
</html>
