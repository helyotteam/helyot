  <rect x="4.2" y="4.2" width="23.6" height="23.6" stroke="#E8B86D" stroke-width="2" fill="none"/>
  <g stroke="#E8B86D" stroke-width="2.8" stroke-linecap="square">
    <path d="M11.2 10.5 V21.5"/>
    <path d="M20.8 10.5 V21.5"/>
    <path d="M11.2 16 H20.8"/>
  </g>
</svg>
